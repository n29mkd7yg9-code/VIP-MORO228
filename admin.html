<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — VIP MORO228</title><link rel="stylesheet" href="/style.css"><style>.admin-wrap{max-width:980px;margin:50px auto;padding:20px}.admin-card{background:#101d30;border:1px solid #283950;border-radius:16px;padding:22px;margin:18px 0}.admin-card input,.admin-card textarea,.admin-card select{width:100%;margin:6px 0 14px;padding:12px;border-radius:8px;border:1px solid #34445a;background:#0b1525;color:white}.admin-card label{display:block}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.admin-note{color:#bdc8d8;font-size:.9rem}.admin-item{border-top:1px solid #34445a;padding:12px 0}.hidden{display:none!important}</style></head><body><header class="top"><a class="brand" href="/"><span class="crest">M</span><span>VIP <b>MORO228</b><small>ADMINISTRATION</small></span></a><a class="btn btn-outline" href="/">Voir le site</a></header><main class="admin-wrap"><p class="eyebrow">ZONE PRIVÉE</p><h1>Administration</h1><p class="admin-note">Connecte-toi avec les identifiants administrateur définis dans les variables du serveur. Ne partage jamais ce compte.</p><section class="admin-card" id="login-card"><form id="admin-login"><label>E-mail administrateur<input name="email" type="email" required autocomplete="username"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-gold" type="submit">Connexion</button><p id="login-message" aria-live="polite"></p></form></section><section id="dashboard" class="hidden"><div class="admin-card"><h2>Vue d’ensemble</h2><div id="summary" class="admin-grid"></div></div><div class="admin-card"><h2>Publier un pronostic VIP</h2><form id="prediction-form"><label>Match<input name="match_label" required maxlength="160" placeholder="Équipe A - Équipe B"></label><label>Date et heure du match<input name="kickoff" type="datetime-local" required></label><label>Marché<input name="market" required maxlength="80" placeholder="Ex. Total de buts"></label><label>Pronostic<input name="pick" required maxlength="160" placeholder="Ex. Plus de 1,5 buts"></label><label>Analyse<textarea name="analysis" required maxlength="2000" rows="4"></textarea></label><label>Confiance estimée (%)<input name="confidence" type="number" min="1" max="100" value="65" required></label><button class="btn btn-gold" type="submit">Publier dans l’espace VIP</button><p id="prediction-message" aria-live="polite"></p></form></div><div class="admin-card"><h2>Pronostics publiés</h2><div id="prediction-list"></div></div><button class="btn btn-outline" id="admin-logout">Déconnexion</button></section></main><script src="/admin.js" defer></script></body></html>
